<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photography — Abin Varghese</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="grain-overlay" aria-hidden="true"></div>
<header class="nav"></header>

<!-- ===================== PAGE HEAD ===================== -->
<section class="section--tight bound" data-screen-label="Photography / Header" style="padding-top:clamp(120px,12vw,180px);padding-bottom:clamp(16px,2vw,28px)">
  <div class="work-head" style="display:block;margin-bottom:8px">
    <h2 class="rv in" style="font-size:clamp(28px,4.2vw,58px);line-height:1.04">Photography Portfolio</h2>
  </div>
</section>

<!-- ===================== PHOTO GRID ===================== -->
<section class="section--tight bound" style="padding-top:clamp(20px,2.4vw,40px)">
  <h2 class="clients-title clients-title--sub rv" style="margin-bottom:clamp(20px,2.4vw,36px)">Nivea Middle East</h2>
  <div class="photo-grid photo-grid--3" id="niveaGrid"></div>

  <h2 class="clients-title clients-title--sub rv" style="margin-top:clamp(48px,6vw,90px);margin-bottom:clamp(20px,2.4vw,36px)">AOK London</h2>
  <div class="photo-grid" id="photoGrid"></div>

  <h2 class="clients-title clients-title--sub rv" style="margin-top:clamp(48px,6vw,90px);margin-bottom:clamp(8px,1vw,14px)">Passion Projects</h2>
  <h3 class="photo-subhead photo-subhead--plain rv">My experiments in lighting &amp; framing</h3>

  <div class="photo-grid photo-grid--p" id="expGrid"></div>
  <div class="photo-grid photo-grid--h" id="newHGrid" style="margin-top:clamp(14px,1.5vw,26px)"></div>
</section>

<!-- ===================== LIGHTBOX ===================== -->
<div class="lb" id="lightbox" aria-hidden="true">
  <div class="lb__bg" data-close></div>
  <button class="lb__close" data-close>Close <span>✕</span></button>
  <button class="lb__nav lb__prev" data-prev aria-label="Previous">‹</button>
  <img class="lb__img" id="lbImg" alt="">
  <button class="lb__nav lb__next" data-next aria-label="Next">›</button>
  <div class="lb__cap" id="lbCap"></div>
</div>

<footer class="footer"></footer>

<script>window.PAGE='photography';</script>
<script src="site.js"></script>
<script>
(function(){
  // Passion Projects — portrait shoot (deduped)
  var PASSION = ['01','04','08','06','10','13','12','15','16','19','20','21'].map(function(num){
    return {src:'assets/photos/passion-'+num+'.jpg', t:'Portrait', n:'Passion Project'};
  });
  var NIVEA = [
    {src:'assets/photos/nivea-01.jpg', t:'Body Oil-Serum',  n:'Nivea ME', r:'p'},
    {src:'assets/photos/nivea-02.jpg', t:'Application',     n:'Nivea ME', r:'p'},
    {src:'assets/photos/nivea-03.jpg', t:'Product',         n:'Nivea ME', r:'p'}
  ];
  // AOK London — Freelance Photography
  var AOK = [
    {src:'assets/photos/aok-06.jpg', t:'Chain Bracelet',     n:'AOK London'},
    {src:'assets/photos/aok-02.jpg', t:'Braided Bracelet',   n:'AOK London'},
    {src:'assets/photos/aok-03.jpg', t:'Triangle Pendant',   n:'AOK London'},
    {src:'assets/photos/aok-04.jpg', t:'Leather Wallet',     n:'AOK London'},
    {src:'assets/photos/aok-01.jpg', t:'Bifold — Interior',  n:'AOK London'},
    {src:'assets/photos/aok-05.jpg', t:'Bifold — Classic',   n:'AOK London'}
  ];
  // My experiments in lighting & framing
  var EXPER = ['01','02','03','04','05','06','07','08','09','10','11','12'].map(function(num){
    return {src:'assets/photos/exp-'+num+'.jpg', t:'Lighting & Framing', n:'Experiment'};
  });
  var NEWV = ['15'].map(function(num){
    return {src:'assets/photos/new-v'+num+'.jpg', t:'Lighting & Framing', n:'Experiment'};
  });
  var NEWH = ['01','02','03','04','05'].map(function(num){
    return {src:'assets/photos/new-h'+num+'.jpg', t:'Lighting & Framing', n:'Experiment'};
  });
  var LADY = ['01','02','03'].map(function(num){
    return {src:'assets/photos/waterfront-'+num+'.jpg', t:'Lighting & Framing', n:'Experiment'};
  }).concat(['01','02','03'].map(function(num){
    return {src:'assets/photos/lady-'+num+'.jpg', t:'Lighting & Framing', n:'Experiment'};
  })).concat(['01','02','03','04','05','06','07','08','09'].map(function(num){
    return {src:'assets/photos/ladyb-'+num+'.jpg', t:'Lighting & Framing', n:'Experiment'};
  }));
  // Full shoot batch (compressed) — ALL images, in exact folder order
  var SHOOT=[];
  for(var si=1;si<=84;si++){
    var sn=String(si).padStart(3,'0');
    SHOOT.push({src:'assets/photos/sh-'+sn+'.jpg', t:'Photography', n:'Shoot'});
  }
  var PHOTOS = NIVEA.concat(AOK).concat(EXPER).concat(NEWV).concat(SHOOT).concat(LADY).concat(NEWH);
  function render(arr, mount, offset){
    var el=document.getElementById(mount);
    el.innerHTML=arr.map(function(p,i){
      return '<figure class="rv" data-i="'+(offset+i)+'"><div class="pm"><img loading="lazy" src="'+p.src+'" alt="'+p.t+' — '+p.n+'"></div></figure>';
    }).join('');
  }
  var o=0;
  render(NIVEA,'niveaGrid',o); o+=NIVEA.length;
  render(AOK,'photoGrid',o); o+=AOK.length;
  // all portrait experiment images flow in ONE continuous grid (no per-section row breaks)
  var PORTRAIT = EXPER.concat(NEWV).concat(SHOOT).concat(LADY);
  render(PORTRAIT,'expGrid',o); o+=PORTRAIT.length;
  render(NEWH,'newHGrid',o); o+=NEWH.length;
  var grids=['niveaGrid','photoGrid','expGrid','newHGrid'].map(function(id){return document.getElementById(id);});

  // reveal
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.06,rootMargin:'0px 0px -5% 0px'});
  grids.forEach(function(g){g.querySelectorAll('.rv').forEach(function(el){io.observe(el);});});

  // lightbox
  var lb=document.getElementById('lightbox'),lbImg=document.getElementById('lbImg'),lbCap=document.getElementById('lbCap'),cur=0;
  function show(i){cur=(i+PHOTOS.length)%PHOTOS.length;lbImg.src=PHOTOS[cur].src;lbImg.alt=PHOTOS[cur].t;}
  function open(i){show(i);lb.classList.add('open');lb.setAttribute('aria-hidden','false');document.documentElement.style.overflow='hidden';}
  function close(){lb.classList.remove('open');lb.setAttribute('aria-hidden','true');document.documentElement.style.overflow='';lbImg.src='';}
  grids.forEach(function(g){g.addEventListener('click',function(e){var f=e.target.closest('figure');if(f)open(+f.getAttribute('data-i'));});});
  lb.addEventListener('click',function(e){if(e.target.hasAttribute('data-close'))close();if(e.target.hasAttribute('data-prev'))show(cur-1);if(e.target.hasAttribute('data-next'))show(cur+1);});
  document.addEventListener('keydown',function(e){if(!lb.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1);});
})();
</script>
</body>
</html>
