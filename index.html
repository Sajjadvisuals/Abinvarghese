<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abin Varghese - Content Creator / Video Editor / Videographer</title>
<meta property="og:title" content="Abin Varghese - Content Creator / Video Editor / Videographer">
<meta property="og:type" content="website">
<meta name="description" content="Abin Varghese — Content Creator, Video Editor & Videographer based in Dubai, UAE.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="grain-overlay" aria-hidden="true"></div>
<header class="nav"></header>

<!-- ===================== HERO ===================== -->
<section class="hero" data-screen-label="Home / Hero">
  <div class="hero__media">
    <video id="heroVideo" autoplay muted loop playsinline preload="auto" poster="assets/hero.jpg">
      <source src="assets/showreel.mp4" type="video/mp4">
    </video>
  </div>
  <div class="hero__scrim"></div>
  <div class="hero__scrim-2"></div>

  <button id="soundToggle" class="sound-toggle hero__sound" aria-label="Toggle sound">
    <span class="sound-toggle__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span id="soundLabel">Sound off</span>
  </button>

  <a href="#selected-work" class="hero__scroll" aria-label="Scroll to selected work">
    <span class="hero__scroll-label">Scroll — Selected Work</span>
    <span class="hero__scroll-line" aria-hidden="true"><i></i></span>
    <span class="hero__scroll-arrow" aria-hidden="true">↓</span>
  </a>
</section>

<!-- ===================== SELECTED WORK (peek) ===================== -->
<section id="selected-work" class="section section--tight bound" style="padding-top:clamp(56px,6vw,96px)">
  <div class="work-head">
    <h2 class="rv">Selected Work</h2>
    <a href="video-editing.html" class="fp fp-ink rv" style="display:inline-flex;gap:8px;align-items:center">VIEW ALL PROJECTS <span style="color:var(--accent)">↗</span></a>
  </div>

  <div id="mixGrid"></div>
</section>

<!-- ===================== CLIENTS & AGENCIES ===================== -->
<section class="section bound">
  <h2 class="clients-title rv">Clients &amp; Agencies</h2>
  <div class="chips rv rv-d1" style="margin-top:clamp(28px,3vw,48px)">
    <span class="chip">Red Bull</span><span class="chip">Nivea</span><span class="chip">Emirates NBD</span>
    <span class="chip">ADNOC</span><span class="chip">e&amp;</span><span class="chip">GMC</span>
    <span class="chip">Carrera</span><span class="chip">Starbucks</span><span class="chip">Oracle</span>
    <span class="chip">DEWA</span><span class="chip">PIF — KSA</span><span class="chip">Namshi</span>
    <span class="chip">Discovery</span><span class="chip">B4U</span><span class="chip">Star</span>
    <span class="chip">Saatchi &amp; Saatchi</span><span class="chip">Leo Burnett</span><span class="chip">Impact BBDO</span>
    <span class="chip">Prodigious ME</span><span class="chip">Create</span><span class="chip">Social-Eyes</span><span class="chip">Dejavu Dubai</span>
  </div>
</section>

<footer class="footer"></footer>

<script>window.PAGE='home';</script>
<script src="projects.js"></script>
<script src="site.js"></script>
<script>renderMixedCC('#mixGrid');</script>
<script>
  (function(){
    var v=document.getElementById('heroVideo'),btn=document.getElementById('soundToggle'),lab=document.getElementById('soundLabel');
    if(!v||!btn)return;
    // ensure autoplay kicks in on browsers that pause muted video
    var tryPlay=function(){var p=v.play();if(p&&p.catch)p.catch(function(){});};
    v.addEventListener('canplay',tryPlay);tryPlay();
    btn.addEventListener('click',function(){
      v.muted=!v.muted;
      if(!v.muted){v.volume=1;tryPlay();}
      btn.classList.toggle('on',!v.muted);
      lab.textContent=v.muted?'Sound off':'Sound on';
    });
  })();
</script>
</body>
</html>
